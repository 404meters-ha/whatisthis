name: Build & Verify

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Plugin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        # verifyPlugin downloads several IDEs; stock runner disk is too tight.
        shell: bash
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew buildPlugin

      - name: Verify Plugin Compatibility (2024.3+)
        run: ./gradlew verifyPlugin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatisthis-${{ steps.properties.outputs.version }}
          path: build/distributions/*.zip

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: whatisthis-${{ needs.build.outputs.version }}

      - name: Create GitHub Release with plugin zip
        uses: softprops/action-gh-release@v2
        with:
          files: whatisthis-*.zip
          generate_release_notes: true

  marketplace:
    name: Publish to Marketplace
    needs: build
    # `secrets` cannot be referenced from a job-level `if` - the token check
    # lives in the publish step instead, so this job is a clean skip until
    # JETBRAINS_TOKEN is configured as a secret.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        if: env.JETBRAINS_TOKEN != ''
        run: ./gradlew publishPlugin -PjetbrainsToken=$JETBRAINS_TOKEN
